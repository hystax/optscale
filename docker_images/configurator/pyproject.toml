[project]
name = "configurator"
version = "0.1.0"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "mysql-connector-python==9.1.0",
    "pyyaml==6.0.1",
    "sqlalchemy==1.3.24",
    "pymongo==4.6.3",
    "pika==1.1.0",
    "influxdb==4.1.1",
    "boto3==1.34.7",
    "urllib3==2.7.0",
    "config-client",
]

[tool.uv.sources]
config-client = { path = "../../optscale_client/config_client", editable = true }

[dependency-groups]
dev = [
    "pycodestyle==2.11.1",
    "pylint==3.0.2",
]
