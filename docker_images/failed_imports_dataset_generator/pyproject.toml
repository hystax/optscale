[project]
name = "failed-imports-dataset-generator"
version = "0.1.0"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "boto3==1.34.7",
    "mysql-connector-python==9.1.0",
    "sqlalchemy==1.3.24",
    "config-client",
    "optscale-time",
]

[tool.uv.sources]
config-client = { path = "../../optscale_client/config_client", editable = true }
optscale-time = { path = "../../tools/optscale_time", editable = true }

[dependency-groups]
dev = [
    "pycodestyle==2.11.1",
    "pylint==3.0.2",
]
