[project]
name = "jira-bus-client"
version = "0.0.0"
description = "OptScale Jira Bus Client"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "requests==2.32.4",
    "retrying>=1.3.3",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["optscale_client.jira_bus_client*"]
namespaces = true
