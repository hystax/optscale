{{- $config := .Values.influxdb -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $config.service.name }}
  labels:
    app: {{ $config.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  type: {{ $config.service.type }}
  ports:
    - port: {{ $config.service.externalPort }}
      targetPort: {{ $config.service.internalPort }}
      protocol: TCP
      name: {{ $config.service.name }}
  selector:
    app: {{ $config.name }}
    release: {{ .Release.Name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{ $config.name }}"
  labels:
    app: "{{ $config.name }}"
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: "{{ $config.name }}"
      release: "{{ .Release.Name }}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $config.name }}
  labels:
    app: {{ $config.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $config.name }}
      release: {{ .Release.Name }}
  serviceName: {{ $config.service.name }}
  template:
    metadata:
      labels:
        app: {{ $config.name }}
        release: {{ .Release.Name }}
    spec:
      imagePullSecrets:
      - name: dockerhub-creds
{{- if .Values.elk.enabled }}
      initContainers:
{{ include "wait_for_elk" . | indent 6 }}
{{- end }}
{{ include "anti-affinity" $config | indent 6 }}
      containers:
      - name: {{ $config.name }}
        image: "{{ .Values.docker_registry }}/{{ $config.image.repository }}:{{ if .Values.docker_tag }}{{ .Values.docker_tag }}{{ else }}{{ $config.image.tag }}{{ end }}"
        imagePullPolicy: {{ $config.image.pullPolicy }}
        ports:
        - containerPort: {{ $config.service.internalPort }}
        volumeMounts:
        - name: influxdb-storage
          mountPath: /var/lib/influxdb
          readOnly: false
          mountPropagation: HostToContainer
        readinessProbe:
          httpGet:
            path: /ping
            port: {{ $config.service.internalPort }}
        env:
        - name: IMAGE_ID
          value: {{ $config.image.id }}
{{- if not $config.usePersistentVolume }}
      volumes:
      - name: influxdb-storage
        hostPath:
          path: /optscale/influxdb
          type: DirectoryOrCreate
{{- end }}
{{- if $config.usePersistentVolume }}
  volumeClaimTemplates:
  - metadata:
      name: influxdb-storage
      labels:
        app: {{ $config.name }}
        release: {{ .Release.Name }}
    spec:
      storageClassName: gp3-expand
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
{{- end }}
