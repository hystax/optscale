{{- $config := .Values.organization_violations }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $config.name }}-worker
  labels:
    app: {{ $config.name }}-worker
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $config.name }}-worker
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $config.name }}-worker
        release: {{ .Release.Name }}
    spec:
{{ include "image.pullSecrets" $ | indent 6 }}
      initContainers:
{{ include "wait_for_service" .Values.rabbitmq | indent 6 }}
{{ include "wait_for_service" .Values.rest_api | indent 6 }}
      containers:
      - name: {{ $config.name }}-worker
        image: "{{ include "image.ref" (dict "registry" .Values.docker_registry "repository" $config.image.repository "tag" $config.image.tag "dockerTag" .Values.docker_tag) }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: IMAGE_ID
          value: {{ $config.image.id }}
        - name: HX_ETCD_HOST
          value: {{ .Values.etcd.service.name }}
        - name: HX_ETCD_PORT
          value: {{ .Values.etcd.service.externalPort | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $config.name }}-scheduler
  labels:
    app: {{ $config.name }}-scheduler
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  schedule: "{{ $config.schedule }}"
  startingDeadlineSeconds: {{ $config.startingDeadlineSeconds }}
  jobTemplate:
    metadata:
      labels:
        app: {{ $config.name }}-scheduler
        release: {{ $.Release.Name }}
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: {{ $config.name }}-scheduler
            release: {{ $.Release.Name }}
        spec:
{{ include "image.pullSecrets" $ | indent 10 }}
          initContainers:
{{ include "wait_for_service" $.Values.rabbitmq | indent 10 }}
{{ include "wait_for_service" $.Values.rest_api | indent 10 }}
          containers:
          - name: {{ $config.name }}-scheduler
            image: "{{ include "image.ref" (dict "registry" $.Values.docker_registry "repository" $config.image.repository "tag" $config.image.tag "dockerTag" $.Values.docker_tag) }}"
            imagePullPolicy: {{ $.Values.imagePullPolicy }}
            command:
            - "uv"
            - "--project"
            - "docker_images/organization_violations"
            - "run"
            - "python3"
            - "docker_images/organization_violations/scheduler.py"
            env:
            - name: HX_ETCD_HOST
              value: {{ $.Values.etcd.service.name }}
            - name: HX_ETCD_PORT
              value: {{ $.Values.etcd.service.externalPort | quote }}
          restartPolicy: Never
