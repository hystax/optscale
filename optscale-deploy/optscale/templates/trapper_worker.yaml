{{- $config := .Values.trapper_worker -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $config.name }}
  labels:
    app: {{ $config.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $config.name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $config.name }}
        release: {{ .Release.Name }}
    spec:
{{ include "image.pullSecrets" $ | indent 6 }}
      initContainers:
{{ include "wait_for_service" .Values.rabbitmq | indent 6 }}
{{ include "wait_for_service" .Values.etcd | indent 6 }}
{{- if not .Values.mongo.external }}
{{ include "wait_for_service" .Values.mongo | indent 6 }}
{{- end }}
{{ include "wait_for_service" .Values.rest_api | indent 6 }}
{{- if not .Values.clickhouse.external }}
{{ include "wait_for_service" .Values.clickhouse | indent 6 }}
{{- end }}
      containers:
      - name: {{ $config.name }}
        image: "{{ include "image.ref" (dict "registry" .Values.docker_registry "repository" $config.image.repository "tag" $config.image.tag "dockerTag" .Values.docker_tag) }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: IMAGE_ID
          value: {{ $config.image.id }}
        - name: HX_ETCD_HOST
          value: {{ .Values.etcd.service.name }}
        - name: HX_ETCD_PORT
          value: {{ .Values.etcd.service.externalPort | quote }}
