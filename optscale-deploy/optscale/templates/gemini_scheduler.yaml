{{- $config := .Values.gemini_scheduler }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $config.name }}
  labels:
    app: {{ $config.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  schedule: "{{ $config.schedule }}"
  startingDeadlineSeconds: {{ $config.startingDeadlineSeconds }}
  jobTemplate:
    metadata:
      labels:
        app: {{ $config.name }}
        release: {{ .Release.Name }}
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: {{ $config.name }}
            release: {{ .Release.Name }}
        spec:
{{ include "image.pullSecrets" $ | indent 10 }}
          initContainers:
{{ include "wait_for_service" .Values.rabbitmq | indent 10 }}
{{ include "wait_for_service" .Values.etcd | indent 10 }}
{{ include "wait_for_service" .Values.rest_api | indent 10 }}
          containers:
          - name: {{ $config.name }}
            image: "{{ include "image.ref" (dict "registry" $.Values.docker_registry "repository" $config.image.repository "tag" $config.image.tag "dockerTag" $.Values.docker_tag) }}"
            imagePullPolicy: {{ $.Values.imagePullPolicy }}
            env:
            - name: IMAGE_ID
              value: {{ $config.image.id }}
            - name: HX_ETCD_HOST
              value: {{ .Values.etcd.service.name }}
            - name: HX_ETCD_PORT
              value: {{ .Values.etcd.service.externalPort | quote }}
          restartPolicy: Never
