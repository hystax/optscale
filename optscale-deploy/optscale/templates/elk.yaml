{{- $config := .Values.elk -}}
{{- if .Values.elk.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: elkservice
  labels:
    app: elkservice
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  type: {{ $config.service.type | default "ClusterIP" }}
  ports:
  - port: {{ $config.service.logstash_udp_port }}
{{- if eq ($config.service.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ $config.service.logstash_udp_nodeport | default 30201 }}
{{- end }}
    protocol: UDP
    name: logstash-udp
  - port: {{ $config.service.logstash_tcp_port }}
{{- if eq ($config.service.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ $config.service.logstash_tcp_nodeport | default 30202 }}
{{- end }}
    protocol: TCP
    name: logstash-tcp
  - port: 81
    targetPort: {{ $config.service.internal_kibana_port }}
{{- if eq ($config.service.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ $config.service.external_kibana_port }}
{{- end }}
    name: kibana
  selector:
    app: {{ $config.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $config.service.name }}
  labels:
    app: elkservice
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  ports:
  - port: {{ $config.service.externalPort }}
    name: elastic
  - port: {{ $config.service.logstash_tcp_port }}
    name: logstash-tcp
  selector:
    app: {{ $config.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $config.name }}
  labels:
    app: {{ $config.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $config.name }}
      release: {{ .Release.Name }}
  serviceName: elkservice
  template:
    metadata:
      labels:
        app: {{ $config.name }}
        release: {{ .Release.Name }}
    spec:
      imagePullSecrets:
      - name: dockerhub-creds
      containers:
      - name: {{ $config.name }}
        image: "{{ .Values.docker_registry }}/{{ $config.image.repository }}:{{ if .Values.docker_tag }}{{ .Values.docker_tag }}{{ else }}{{ $config.image.tag }}{{ end }}"
        imagePullPolicy: {{ $config.image.pullPolicy }}
        env:
        - name: IMAGE_ID
          value: {{ $config.image.id }}
        - name: ES_CONNECT_RETRY
          value: "{{ $config.es_connect_retry }}"
        - name: LS_HEAP_SIZE
          value: {{ $config.ls_heap_size }}
        - name: ES_HEAP_SIZE
          value: {{ $config.es_heap_size }}
        - name: HTPASSWD_USER
          value: {{ $config.env.htpasswd_user }}
        - name: HTPASSWD_PASS
          value: {{ $config.env.htpasswd_pass }}
        ports:
        - containerPort: {{ $config.service.logstash_udp_port }}
          protocol: UDP
        - containerPort: {{ $config.service.elastic_port }}
        - containerPort: {{ $config.service.logstash_tcp_port }}
        - containerPort: {{ $config.service.internal_kibana_port }}
        volumeMounts:
        - name: etcd-persistent-storage
          mountPath: /var/lib/elasticsearch
          readOnly: false
          mountPropagation: HostToContainer
{{- if not $config.usePersistentVolume }}
      volumes:
      - name: etcd-persistent-storage
        hostPath:
          path: /optscale/elk
          type: DirectoryOrCreate
{{- end }}
{{- if $config.usePersistentVolume }}
  volumeClaimTemplates:
  - metadata:
      name: etcd-persistent-storage
      labels:
        app: {{ $config.name }}
        release: {{ .Release.Name }}
    spec:
      storageClassName: gp3-expand
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
{{- end }}
{{- end -}}
